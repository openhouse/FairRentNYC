name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Verify git is available
        run: git --version

      - name: Install dependencies
        run: npm ci

      - name: Lint JavaScript
        run: npm run lint:js

      - name: Lint templates (legacy baseline; non-blocking)
        continue-on-error: true
        run: npm run lint:hbs

      - name: Run tests
        run: npm test

      - name: FastBoot smoke test
        run: ./scripts/ci-fastboot-smoke.sh
